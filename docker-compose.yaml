# Start with:  docker compose --env-file src/.env up -d
# Passwords come from src/.env (MYSQL_ROOT_PASSWORD, DB_PASSWORD).
# Both ports are bound to this machine only. To use Adminer from another PC:
#   ssh -L 8080:127.0.0.1:8080 <user>@<this-host>   then open http://localhost:8080

services:
  db:
    image: mysql:8.0
    container_name: mysql_finance_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in src/.env}
      MYSQL_DATABASE: finance_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in src/.env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # (Opcional) Gestor de base de datos visual en el navegador
  adminer:
    image: adminer
    container_name: adminer_finance
    restart: always
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  mysql_data:
